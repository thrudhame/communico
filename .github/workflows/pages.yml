name: pages
on:
  push:
    branches: [spike/communico-lite]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: lite/web
      # www/lite is the PUBLIC surface (a curated copy of only what the
      # browser needs) — lite/web stays the dev source of truth. The spike
      # pages (and w0's vendored artifact they load) ride inside www/lite.
      - run: |
          set -euo pipefail
          mkdir -p www/lite/node_modules/@trystero-p2p www/lite/node_modules/@dolthub www/lite/node_modules/@noble
          cp lite/web/index.html lite/web/app.js lite/web/engine-lite.js \
             lite/web/lp-spikes.html lite/web/lp-spikes.js \
             lite/web/ms-spikes.html lite/web/ms-spikes.js \
             lite/web/msync-longevity.html lite/web/msync-longevity.js \
             lite/web/spikes.html lite/web/spikes.js \
             www/lite/
          cp -r lite/web/sync www/lite/sync
          cp -r lite/web/w0 www/lite/w0
          cp -r lite/web/node_modules/trystero www/lite/node_modules/trystero
          cp -r lite/web/node_modules/@trystero-p2p/nostr www/lite/node_modules/@trystero-p2p/nostr
          cp -r lite/web/node_modules/@trystero-p2p/core www/lite/node_modules/@trystero-p2p/core
          cp -r lite/web/node_modules/@noble/secp256k1 www/lite/node_modules/@noble/secp256k1
          cp -r lite/web/node_modules/@dolthub/doltlite-wasm www/lite/node_modules/@dolthub/doltlite-wasm
          cp -r lite/web/node_modules/wa-sqlite www/lite/node_modules/wa-sqlite
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
