name: pages
on:
  push:
    branches: [spike/communico-lite]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # www/ is the PUBLIC surface; lite/web is the dev source of truth.
      # Tip build: www/lite always tracks the branch tip. The copy recipe
      # lives in the repo (lite/web/pages-copy.sh <src> <dst>).
      - run: npm ci
        working-directory: lite/web
      - run: bash lite/web/pages-copy.sh lite/web www/lite
      # Frozen milestones: one leg per tag — checkout the tag, npm ci with
      # THAT ref's lockfile (each frozen version keeps its own wasm build),
      # then copy with THAT ref's own pages-copy.sh into www/lite-<tag>/.
      - uses: actions/checkout@v4
        with: { ref: lite-v0, path: refs/lite-v0 }
      - run: npm ci
        working-directory: refs/lite-v0/lite/web
      - run: bash refs/lite-v0/lite/web/pages-copy.sh refs/lite-v0/lite/web www/lite-v0
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
