# Interpolation reads COMMUNICO_* from the devcontainer's .env (copy
# .env.example). No compose default fallbacks — a missing value fails
# loud; the shipped defaults/communico.toml is the app's source of truth.
services:
  communico:
    env_file: ../.env
    image: communico:devcontainer
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOLTGRES_USER: ${COMMUNICO_DB_USER}
      DOLTGRES_PASSWORD: ${COMMUNICO_DB_PASS}
      DOLTGRES_DB: ${COMMUNICO_DB_NAME}
      DOLTGRES_DATA_DIR: ${DB_DATA_DIR}
    ports:
      - '${COMMUNICO_DB_PORT}:5432'
      - '${COMMUNICO_SERVER_PORT}:8008'
    volumes:
      - ../doltgres/config:/etc/doltgres/servercfg.d
      - ..:/workspace:cached
    command: sleep infinity
    # OOM / fork-bomb protection — hard caps for the dev workload
    # (doltgres x2, deno servers x2, ingest bench). See plans:
    # dolt-room-engine/execution/README.md "Pre-flight".
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 512
    cpus: 4
