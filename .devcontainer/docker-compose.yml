services:
  communico:
    env_file: ../.env
    image: communico:devcontainer
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOLTGRES_USER: ${DB_USER}
      DOLTGRES_PASSWORD: ${DB_PASS}
      DOLTGRES_DB: ${DB_NAME}
      DOLTGRES_DATA_DIR: ${DB_DATA_DIR}
    ports:
      - "${DB_PORT:-5432}:5432"
      - "${APP_PORT:-8008}:8008"
    volumes:
      - ../doltgres/config:/etc/doltgres/servercfg.d
      - ..:/workspace:cached
    command: sleep infinity
    # OOM / fork-bomb protection — hard caps for the dev workload
    # (doltgres x2, deno servers x2, ingest bench). See plans:
    # dolt-room-engine/execution/README.md "Pre-flight".
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 512
    cpus: 4
